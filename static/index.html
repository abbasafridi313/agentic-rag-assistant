<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic RAG Assistant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  html, body { height: 100%; }
  body { background: #0f0f0f; color: #ececec; display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

  #sidebar { width: 260px; background: #171717; border-right: 1px solid #2d2d2d; display: flex; flex-direction: column; padding: 14px 8px; }
  #sidebar-header { display: flex; align-items: center; gap: 8px; padding: 6px 8px 18px 8px; font-size: 1.05rem; font-weight: 600; }
  .side-item { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: 8px; cursor: pointer; font-size: 0.92rem; color: #d1d1d1; }
  .side-item:hover { background: #2a2a2a; color: #fff; }
  .side-item .icon { width: 18px; text-align: center; font-size: 1rem; }
  #new-chat-item { font-weight: 500; color: #ececec; margin-bottom: 6px; }
  #static-menu { display: flex; flex-direction: column; gap: 1px; margin-bottom: 10px; }
  #recents-label { color: #8e8e8e; font-size: 0.75rem; font-weight: 600; padding: 14px 10px 6px 10px; letter-spacing: 0.3px; }
  #chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; }

  .chat-item-row { position: relative; display: flex; align-items: center; border-radius: 8px; }
  .chat-item-row:hover { background: #2a2a2a; }
  .chat-item-row.active { background: #2a2a2a; }
  .chat-item {
    flex: 1;
    padding: 9px 10px;
    cursor: pointer;
    font-size: 0.88rem;
    color: #d1d1d1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-item-row.active .chat-item { color: #fff; }
  .chat-menu-btn {
    background: transparent;
    border: none;
    color: #9ca3af;
    padding: 6px 8px;
    cursor: pointer;
    font-size: 1rem;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .chat-menu-btn:hover { background: #3a3a3a; color: #fff; }
  .chat-dropdown {
    position: absolute;
    right: 4px;
    top: 100%;
    background: #232323;
    border: 1px solid #3d3d3d;
    border-radius: 8px;
    z-index: 50;
    min-width: 130px;
    overflow: hidden;
    display: none;
  }
  .chat-dropdown.show { display: block; }
  .chat-dropdown button {
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: none;
    color: #ececec;
    padding: 9px 12px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .chat-dropdown button:hover { background: #333; }
  .chat-dropdown button.danger { color: #ef4444; }

  #sidebar-footer { display: flex; align-items: center; gap: 10px; padding: 10px; border-top: 1px solid #2d2d2d; margin-top: 8px; cursor: pointer; }
  #sidebar-footer:hover { background: #2a2a2a; border-radius: 8px; }
  #avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #22c55e, #16a34a); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: #fff; flex-shrink: 0; }
  #user-info { display: flex; flex-direction: column; line-height: 1.2; overflow: hidden; }
  #user-name { font-size: 0.85rem; color: #ececec; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #user-plan { font-size: 0.75rem; color: #8e8e8e; }

  #main { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
  #chat-area { flex: 1; overflow-y: auto; padding: 24px 0; display: flex; flex-direction: column; align-items: center; }
  #chat-inner { width: 100%; max-width: 780px; padding: 0 20px; }
  #welcome { text-align: center; font-size: 2rem; font-weight: 600; margin-top: 15vh; color: #ececec; }

  .msg-row { display: flex; margin: 14px 0; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.assistant { justify-content: flex-start; }
  .bubble-user { background: #2f2f2f; color: #ececec; padding: 10px 16px; border-radius: 20px; max-width: 70%; font-size: 1rem; line-height: 1.5; white-space: pre-wrap; }
  .bubble-assistant { color: #ececec; max-width: 85%; font-size: 1rem; line-height: 1.7; white-space: pre-wrap; }
  .thinking { color: #9ca3af; font-style: italic; }
  audio { margin-top: 8px; width: 260px; }

  /* Input bar: normal flow (not absolute) so it naturally sits above mobile nav buttons */
  #input-bar {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    padding: 14px 20px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    background: #0f0f0f;
  }
  #input-box {
    width: 100%;
    max-width: 780px;
    background: #2f2f2f;
    border: 1px solid #3d3d3d;
    border-radius: 24px;
    padding: 10px 14px;
  }
  #text-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #ececec;
    font-size: 1rem;
    resize: none;
    max-height: 120px;
    padding: 4px 2px 10px 2px;
  }
  #text-input::placeholder { color: #8e8e8e; }
  #input-controls-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #input-controls-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon-btn { background: #3a3a3a; border: none; color: #ececec; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.05rem; flex-shrink: 0; }
  .icon-btn:hover { background: #4a4a4a; }
  #mic-btn.recording { background: linear-gradient(135deg, #ef4444, #dc2626); animation: pulse 1.2s infinite; }
  #send-btn { background: #ececec; color: #0f0f0f; }
  #send-btn:hover { background: #d1d1d1; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.6); } 70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  #file-input { display: none; }
  #status-msg { text-align: center; color: #9ca3af; font-size: 0.85rem; margin-bottom: 6px; }

  #library-modal, #auth-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
  #library-box { background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 14px; width: 500px; max-height: 70vh; display: flex; flex-direction: column; padding: 20px; }
  #library-box h3 { margin-bottom: 16px; }
  #library-list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .doc-row { display: flex; justify-content: space-between; align-items: center; background: #232323; padding: 10px 14px; border-radius: 8px; }
  .doc-info { display: flex; flex-direction: column; }
  .doc-title { font-size: 0.92rem; }
  .doc-meta { font-size: 0.78rem; color: #8e8e8e; }
  .doc-delete { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 1rem; }
  #close-library { margin-top: 14px; background: #2f2f2f; border: none; color: #ececec; padding: 8px; border-radius: 8px; cursor: pointer; }
  .side-item.disabled { opacity: 0.4; cursor: default; }
  .side-item.disabled:hover { background: transparent; color: #d1d1d1; }

  #auth-box { background: #1a1a1a; border: 1px solid #2d2d2d; border-radius: 14px; width: 380px; padding: 28px; }
  #auth-box h3 { margin-bottom: 4px; font-size: 1.3rem; }
  #auth-subtitle { color: #8e8e8e; font-size: 0.85rem; margin-bottom: 20px; }
  #auth-box input {
    width: 100%;
    background: #2a2a2a;
    border: 1px solid #3d3d3d;
    border-radius: 8px;
    color: #ececec;
    padding: 11px 12px;
    font-size: 0.95rem;
    margin-bottom: 12px;
    outline: none;
  }
  #auth-box input:focus { border-color: #6366f1; }
  #auth-box button.primary {
    width: 100%;
    background: #ececec;
    color: #0f0f0f;
    border: none;
    padding: 11px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    margin-bottom: 10px;
    font-size: 0.95rem;
  }
  #auth-box button.primary:hover { background: #d1d1d1; }
  #auth-toggle-text { text-align: center; font-size: 0.85rem; color: #8e8e8e; }
  #auth-toggle-link { color: #6366f1; cursor: pointer; font-weight: 600; }
  #auth-cancel-x { text-align: right; cursor: pointer; color: #8e8e8e; margin-bottom: 6px; }
  #auth-status { font-size: 0.85rem; margin-bottom: 10px; min-height: 18px; }
  #confirm-notice { display: none; text-align: center; color: #22c55e; font-size: 0.9rem; }

  @media (max-width: 768px) {
    #sidebar {
      position: fixed;
      left: -280px;
      top: 0;
      bottom: 0;
      z-index: 200;
      transition: left 0.2s ease;
      width: 260px;
    }
    #sidebar.open { left: 0; }
    #main { width: 100%; }
    #mobile-menu-btn { display: flex !important; }
    #mobile-menu-btn.hide-btn { display: none !important; }
    #chat-inner { padding: 0 12px; }
    .bubble-user, .bubble-assistant { max-width: 88%; }
    #welcome { font-size: 1.5rem; padding: 0 20px; }
  }
  #mobile-menu-btn {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 201;
    background: #2f2f2f;
    border: none;
    color: #ececec;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    cursor: pointer;
  }
  #sidebar-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    z-index: 199;
  }
  #sidebar-overlay.show { display: block; }
</style>
</head>
<body>

<button id="mobile-menu-btn">☰</button>
<div id="sidebar-overlay"></div>

<div id="sidebar">
  <div id="sidebar-header">🧠 Agentic RAG</div>
  <div class="side-item" id="new-chat-item"><span class="icon">✏️</span> New chat</div>
  <div id="static-menu">
    <div class="side-item" id="library-btn"><span class="icon">📚</span> Library</div>
    <div class="side-item disabled"><span class="icon">🖼️</span> Images <span style="margin-left:auto; font-size:0.68rem; color:#8e8e8e;">soon</span></div>
    <div class="side-item disabled"><span class="icon">🕐</span> Scheduled <span style="margin-left:auto; font-size:0.68rem; color:#8e8e8e;">soon</span></div>
    <div class="side-item disabled"><span class="icon">🧩</span> Plugins <span style="margin-left:auto; font-size:0.68rem; color:#8e8e8e;">soon</span></div>
  </div>
  <div id="recents-label">Chats</div>
  <div id="chat-list"></div>
  <div id="sidebar-footer">
    <div id="avatar">G</div>
    <div id="user-info"><div id="user-name">Guest</div><div id="user-plan">Click to sign in</div></div>
  </div>
</div>

<div id="main">
  <div id="chat-area">
    <div id="chat-inner">
      <div id="welcome"></div>
      <div id="messages"></div>
    </div>
  </div>
  <div id="input-bar">
    <div id="input-box">
      <div id="status-msg"></div>
      <textarea id="text-input" placeholder="Ask anything" rows="1"></textarea>
      <div id="input-controls-row">
        <button class="icon-btn" id="attach-btn" title="Add knowledge">➕</button>
        <input type="file" id="file-input" accept=".txt,.pdf,.docx">
        <div id="input-controls-right">
          <button class="icon-btn" id="mic-btn" title="Voice">🎙️</button>
          <button class="icon-btn" id="send-btn" title="Send">➤</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="library-modal">
  <div id="library-box">
    <h3>📚 Your Documents</h3>
    <div id="library-list"></div>
    <button id="close-library">Close</button>
  </div>
</div>

<div id="auth-modal">
  <div id="auth-box">
    <div id="auth-cancel-x">✕</div>
    <h3 id="auth-title">Welcome back</h3>
    <div id="auth-subtitle">Sign in to save your chats across devices</div>

    <div id="auth-form">
      <div id="auth-status"></div>
      <input type="email" id="auth-email" placeholder="Email address" autocomplete="email">
      <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
      <button class="primary" id="auth-submit-btn">Continue</button>
    </div>

    <div id="confirm-notice">✅ Account created! Check your email to confirm, then sign in.</div>

    <div id="auth-toggle-text">
      <span id="auth-toggle-question">Don't have an account?</span>
      <span id="auth-toggle-link">Sign up</span>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ghzbcppezdcjjvnyicak.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_twrph4YiT03yDiqWqisY_Q_MxWPDAO1";
const supabaseAuth = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentUser = null;
let authMode = 'signin';

const WELCOME_MESSAGES = [
  "What's on your mind today?",
  "Ready when you are.",
  "How can I help, Abbas?",
  "What are we working on today?",
  "Ask me anything.",
  "Let's get started.",
];
function randomWelcomeMessage() {
  return WELCOME_MESSAGES[Math.floor(Math.random() * WELCOME_MESSAGES.length)];
}

function getAnonId() {
  let id = localStorage.getItem('anon_id');
  if (!id) {
    id = crypto.randomUUID ? crypto.randomUUID() : 'anon-' + Date.now();
    localStorage.setItem('anon_id', id);
  }
  return id;
}
function currentIdentityId() {
  return currentUser ? currentUser.id : getAnonId();
}

function updateUserUI() {
  const avatar = document.getElementById('avatar');
  const nameEl = document.getElementById('user-name');
  const planEl = document.getElementById('user-plan');
  if (currentUser) {
    avatar.textContent = currentUser.email.slice(0, 2).toUpperCase();
    avatar.style.background = 'linear-gradient(135deg, #6366f1, #a855f7)';
    nameEl.textContent = currentUser.email;
    planEl.textContent = 'Signed in — click to log out';
  } else {
    avatar.textContent = 'G';
    avatar.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
    nameEl.textContent = 'Guest';
    planEl.textContent = 'Click to sign in';
  }
}

const authModal = document.getElementById('auth-modal');
const authStatus = document.getElementById('auth-status');
const authForm = document.getElementById('auth-form');
const confirmNotice = document.getElementById('confirm-notice');
const authTitle = document.getElementById('auth-title');
const authSubtitle = document.getElementById('auth-subtitle');
const authSubmitBtn = document.getElementById('auth-submit-btn');
const authToggleQuestion = document.getElementById('auth-toggle-question');
const authToggleLink = document.getElementById('auth-toggle-link');

function setAuthMode(mode) {
  authMode = mode;
  authStatus.textContent = '';
  authForm.style.display = 'block';
  confirmNotice.style.display = 'none';
  if (mode === 'signin') {
    authTitle.textContent = 'Welcome back';
    authSubtitle.textContent = 'Sign in to save your chats across devices';
    authSubmitBtn.textContent = 'Sign in';
    authToggleQuestion.textContent = "Don't have an account?";
    authToggleLink.textContent = 'Sign up';
  } else {
    authTitle.textContent = 'Create your account';
    authSubtitle.textContent = 'Sign up to save your chats across devices';
    authSubmitBtn.textContent = 'Sign up';
    authToggleQuestion.textContent = 'Already have an account?';
    authToggleLink.textContent = 'Sign in';
  }
}

document.getElementById('sidebar-footer').onclick = () => {
  if (currentUser) {
    if (confirm('Log out of ' + currentUser.email + '?')) {
      supabaseAuth.auth.signOut().then(() => {
        currentUser = null;
        updateUserUI();
        initApp();
      });
    }
  } else {
    document.getElementById('auth-email').value = '';
    document.getElementById('auth-password').value = '';
    setAuthMode('signin');
    authModal.style.display = 'flex';
  }
};

document.getElementById('auth-cancel-x').onclick = () => { authModal.style.display = 'none'; };
authToggleLink.onclick = () => setAuthMode(authMode === 'signin' ? 'signup' : 'signin');

authSubmitBtn.onclick = async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;

  if (!email || !password) {
    authStatus.style.color = '#ef4444';
    authStatus.textContent = 'Please fill in both fields.';
    return;
  }
  if (password.length < 6) {
    authStatus.style.color = '#ef4444';
    authStatus.textContent = 'Password must be at least 6 characters.';
    return;
  }

  authStatus.style.color = '#8e8e8e';
  authStatus.textContent = authMode === 'signin' ? 'Signing in...' : 'Creating account...';

  if (authMode === 'signup') {
    const { data, error } = await supabaseAuth.auth.signUp({ email, password });
    if (error) {
      authStatus.style.color = '#ef4444';
      authStatus.textContent = error.message;
    } else {
      authForm.style.display = 'none';
      confirmNotice.style.display = 'block';
    }
  } else {
    const { data, error } = await supabaseAuth.auth.signInWithPassword({ email, password });
    if (error) {
      authStatus.style.color = '#ef4444';
      authStatus.textContent = error.message.includes('Invalid') ? 'Wrong email or password.' : error.message;
    } else {
      currentUser = data.user;
      authModal.style.display = 'none';
      updateUserUI();
      await initApp();
    }
  }
};

let currentChatId = null;
let chatsMeta = {};

const chatListEl = document.getElementById('chat-list');
const messagesEl = document.getElementById('messages');
const welcomeEl = document.getElementById('welcome');
const textInput = document.getElementById('text-input');
const statusMsg = document.getElementById('status-msg');

function closeAllChatDropdowns() {
  document.querySelectorAll('.chat-dropdown').forEach(d => d.classList.remove('show'));
}

function renderChatList() {
  chatListEl.innerHTML = '';
  Object.entries(chatsMeta).forEach(([id, title]) => {
    const row = document.createElement('div');
    row.className = 'chat-item-row' + (id === currentChatId ? ' active' : '');

    const item = document.createElement('div');
    item.className = 'chat-item';
    item.textContent = title;
    item.onclick = () => switchChat(id);

    const menuBtn = document.createElement('button');
    menuBtn.className = 'chat-menu-btn';
    menuBtn.textContent = '⋯';
    menuBtn.onclick = (e) => {
      e.stopPropagation();
      const wasOpen = dropdown.classList.contains('show');
      closeAllChatDropdowns();
      if (!wasOpen) dropdown.classList.add('show');
    };

    const dropdown = document.createElement('div');
    dropdown.className = 'chat-dropdown';

    const renameBtn = document.createElement('button');
    renameBtn.textContent = '✏️ Rename';
    renameBtn.onclick = async (e) => {
      e.stopPropagation();
      closeAllChatDropdowns();
      const newTitle = prompt('Rename chat:', title);
      if (newTitle && newTitle.trim()) {
        const formData = new FormData();
        formData.append('title', newTitle.trim());
        await fetch('/api/chats/' + id, { method: 'PATCH', body: formData });
        chatsMeta[id] = newTitle.trim();
        renderChatList();
      }
    };

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'danger';
    deleteBtn.textContent = '🗑️ Delete';
    deleteBtn.onclick = async (e) => {
      e.stopPropagation();
      closeAllChatDropdowns();
      if (confirm('Delete this chat? This cannot be undone.')) {
        await fetch('/api/chats/' + id, { method: 'DELETE' });
        delete chatsMeta[id];
        if (id === currentChatId) {
          const remaining = Object.keys(chatsMeta);
          if (remaining.length > 0) {
            await switchChat(remaining[0]);
          } else {
            await createNewChat();
          }
        } else {
          renderChatList();
        }
      }
    };

    dropdown.appendChild(renameBtn);
    dropdown.appendChild(deleteBtn);

    row.appendChild(item);
    row.appendChild(menuBtn);
    row.appendChild(dropdown);
    chatListEl.appendChild(row);
  });
}

document.addEventListener('click', closeAllChatDropdowns);

async function loadChatList() {
  const res = await fetch('/api/chats?anon_id=' + currentIdentityId());
  const data = await res.json();
  chatsMeta = {};
  data.chats.forEach(c => chatsMeta[c.id] = c.title);
  renderChatList();
}

async function switchChat(id) {
  currentChatId = id;
  renderChatList();
  const res = await fetch('/api/chats/' + id + '/messages');
  const data = await res.json();
  messagesEl.innerHTML = '';
  if (data.messages.length === 0) {
    welcomeEl.textContent = randomWelcomeMessage();
    welcomeEl.style.display = 'block';
  } else {
    welcomeEl.style.display = 'none';
    data.messages.forEach(m => appendMessageToDOM(m.role, m.content));
  }
  document.getElementById('chat-area').scrollTop = 999999;
  closeSidebar();
}

async function createNewChat() {
  const formData = new FormData();
  formData.append('anon_id', currentIdentityId());
  const res = await fetch('/api/new_chat', { method: 'POST', body: formData });
  const data = await res.json();
  currentChatId = data.chat_id;
  chatsMeta[currentChatId] = 'New Chat';
  renderChatList();
  messagesEl.innerHTML = '';
  welcomeEl.textContent = randomWelcomeMessage();
  welcomeEl.style.display = 'block';
  closeSidebar();
}

function appendMessageToDOM(role, content, audioB64) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const bubble = document.createElement('div');
  bubble.className = role === 'user' ? 'bubble-user' : 'bubble-assistant';
  bubble.textContent = content;
  row.appendChild(bubble);
  messagesEl.appendChild(row);

  if (audioB64) {
    const audio = document.createElement('audio');
    audio.controls = true;
    audio.autoplay = true;
    audio.src = 'data:audio/mp3;base64,' + audioB64;
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-row assistant';
    wrapper.appendChild(audio);
    messagesEl.appendChild(wrapper);
  }
  document.getElementById('chat-area').scrollTop = 999999;
}

async function sendMessage(text, wantVoice) {
  if (!text.trim()) return;
  if (!currentChatId) await createNewChat();

  welcomeEl.style.display = 'none';
  appendMessageToDOM('user', text);

  const thinkingRow = document.createElement('div');
  thinkingRow.className = 'msg-row assistant thinking-row';
  thinkingRow.innerHTML = '<div class="bubble-assistant thinking">Thinking...</div>';
  messagesEl.appendChild(thinkingRow);
  document.getElementById('chat-area').scrollTop = 999999;

  const formData = new FormData();
  formData.append('chat_id', currentChatId);
  formData.append('message', text);
  formData.append('want_voice', wantVoice);

  const res = await fetch('/api/chat', { method: 'POST', body: formData });
  const data = await res.json();

  thinkingRow.remove();
  appendMessageToDOM('assistant', data.answer, data.audio_base64);

  if (chatsMeta[currentChatId] === 'New Chat') {
    await loadChatList();
  }
}

document.getElementById('send-btn').onclick = () => {
  const text = textInput.value;
  textInput.value = '';
  sendMessage(text, false);
};

textInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('send-btn').click();
  }
});

document.getElementById('new-chat-item').onclick = createNewChat;

const fileInput = document.getElementById('file-input');
document.getElementById('attach-btn').onclick = () => fileInput.click();

fileInput.onchange = async () => {
  const file = fileInput.files[0];
  if (!file) return;

  if (!currentChatId) await createNewChat();

  welcomeEl.style.display = 'none';
  appendMessageToDOM('user', '📎 ' + file.name);

  const thinkingRow = document.createElement('div');
  thinkingRow.className = 'msg-row assistant thinking-row';
  thinkingRow.innerHTML = '<div class="bubble-assistant thinking">Reading file...</div>';
  messagesEl.appendChild(thinkingRow);
  document.getElementById('chat-area').scrollTop = 999999;

  const formData = new FormData();
  formData.append('file', file);
  const uploadRes = await fetch('/api/upload', { method: 'POST', body: formData });
  const uploadData = await uploadRes.json();

  thinkingRow.remove();

  if (uploadData.error) {
    appendMessageToDOM('assistant', 'Maaf kijiye, file parh nahi paya: ' + uploadData.error);
    fileInput.value = '';
    return;
  }

  const ackThinking = document.createElement('div');
  ackThinking.className = 'msg-row assistant thinking-row';
  ackThinking.innerHTML = '<div class="bubble-assistant thinking">Thinking...</div>';
  messagesEl.appendChild(ackThinking);
  document.getElementById('chat-area').scrollTop = 999999;

  const chatFormData = new FormData();
  chatFormData.append('chat_id', currentChatId);
  chatFormData.append('message', `I've just uploaded a file called "${file.name}". Please briefly confirm you've read it and are ready to answer questions about it.`);
  chatFormData.append('want_voice', false);

  const chatRes = await fetch('/api/chat', { method: 'POST', body: chatFormData });
  const chatData = await chatRes.json();

  ackThinking.remove();
  appendMessageToDOM('assistant', chatData.answer, chatData.audio_base64);

  if (chatsMeta[currentChatId] === 'New Chat') {
    await loadChatList();
  }

  fileInput.value = '';
};

const micBtn = document.getElementById('mic-btn');
let recognition = null;
let isRecording = false;

if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onstart = () => { isRecording = true; micBtn.classList.add('recording'); statusMsg.textContent = 'Listening...'; };
  recognition.onresult = (event) => { statusMsg.textContent = ''; sendMessage(event.results[0][0].transcript, true); };
  recognition.onerror = (event) => { statusMsg.textContent = 'Error: ' + event.error; setTimeout(() => statusMsg.textContent = '', 4000); };
  recognition.onend = () => { isRecording = false; micBtn.classList.remove('recording'); };

  micBtn.onclick = () => { isRecording ? recognition.stop() : recognition.start(); };
} else {
  micBtn.onclick = () => alert('Voice input is only supported in Chrome/Edge.');
}

const libraryModal = document.getElementById('library-modal');
const libraryList = document.getElementById('library-list');

document.getElementById('library-btn').onclick = async () => {
  libraryModal.style.display = 'flex';
  libraryList.innerHTML = 'Loading...';
  const res = await fetch('/api/documents');
  const data = await res.json();
  libraryList.innerHTML = '';
  if (data.documents.length === 0) {
    libraryList.innerHTML = '<p style="color:#8e8e8e;">No documents uploaded yet.</p>';
    return;
  }
  data.documents.forEach(doc => {
    const row = document.createElement('div');
    row.className = 'doc-row';
    row.innerHTML = `<div class="doc-info"><div class="doc-title">${doc.title}</div><div class="doc-meta">${doc.chunk_count} chunks</div></div><button class="doc-delete" data-id="${doc.id}">🗑️</button>`;
    row.querySelector('.doc-delete').onclick = async (e) => {
      await fetch('/api/documents/' + e.target.dataset.id, { method: 'DELETE' });
      row.remove();
    };
    libraryList.appendChild(row);
  });
};

document.getElementById('close-library').onclick = () => { libraryModal.style.display = 'none'; };

const menuBtn = document.getElementById('mobile-menu-btn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('sidebar-overlay');

function openSidebar() {
  sidebar.classList.add('open');
  overlay.classList.add('show');
  menuBtn.classList.add('hide-btn');
}
function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
  menuBtn.classList.remove('hide-btn');
}
menuBtn.onclick = openSidebar;
overlay.onclick = closeSidebar;

async function initApp() {
  currentChatId = null;
  await loadChatList();
  const firstChatId = Object.keys(chatsMeta)[0];
  if (firstChatId) {
    await switchChat(firstChatId);
  } else {
    await createNewChat();
  }
}

(async () => {
  const { data: { session } } = await supabaseAuth.auth.getSession();
  if (session) {
    currentUser = session.user;
  }
  updateUserUI();
  await initApp();
})();
</script>
